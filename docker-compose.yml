services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: nura_nursing
    ports:
      - "5432:5432"
    volumes:
      - nura_nursing_postgres_data:/var/lib/postgresql/data

volumes:
  nura_nursing_postgres_data:
